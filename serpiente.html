<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Serpiente</title>
<style>
  :root {
    --ink: #14110e;
    --cream: #f3ead7;
    --muted: #cbbfa6;
    --board: #1c2820;
    --line: rgba(243, 234, 215, 0.07);
    --snake: #c6f54a;
    --snake-dark: #7ea31d;
    --berry: #e85d4c;
    --gold: #e7a23a;
    --panel: #231e18;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%;
    color: var(--cream);
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #3a2a1c 0%, transparent 55%),
      var(--ink);
  }
  .app {
    width: min(640px, 100%);
    margin: 0 auto;
    padding: 20px 16px 28px;
  }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  h1 {
    margin: 0;
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -0.03em;
    line-height: 0.95;
  }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
  .hud {
    display: flex;
    gap: 10px;
    align-items: stretch;
    margin: 18px 0 12px;
  }
  .stat {
    flex: 1;
    background: var(--panel);
    border: 1px solid rgba(243, 234, 215, 0.12);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .stat span { display: block; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .stat strong { font-size: 28px; font-variant-numeric: tabular-nums; }
  .stat.gold strong { color: var(--gold); }
  button {
    font: inherit;
    color: var(--ink);
    background: var(--cream);
    border: 0;
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #sound {
    align-self: center;
    background: transparent;
    color: var(--cream);
    border: 1px solid rgba(243, 234, 215, 0.3);
  }
  #sound[aria-pressed="true"] { background: var(--snake); color: var(--ink); border-color: transparent; }
  .stage {
    position: relative;
    width: min(100%, 560px);
    margin: 0 auto;
    aspect-ratio: 1;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
    background: var(--board);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 24px;
    background: rgba(20, 17, 14, 0.72);
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    margin: 0;
    font-family: Palatino, Georgia, serif;
    font-size: 36px;
    font-weight: 600;
  }
  .overlay p { margin: 0 0 10px; color: var(--muted); max-width: 280px; }
  .overlay button { background: var(--snake); font-weight: 700; padding: 12px 22px; }
  .help {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--muted);
    font-size: 13px;
    margin: 12px auto 0;
    width: min(100%, 560px);
  }
  .pad {
    display: grid;
    grid-template-columns: 72px 72px 72px;
    grid-template-areas: ". up ." "left down right";
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }
  .pad button {
    width: 72px;
    height: 64px;
    border-radius: 16px;
    background: #2c261f;
    color: var(--cream);
    font-size: 22px;
  }
  .pad button:active { background: var(--snake); color: var(--ink); }
  #up { grid-area: up; }
  #left { grid-area: left; }
  #down { grid-area: down; }
  #right { grid-area: right; }
  @media (min-width: 800px) {
    .pad { display: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>La Serpiente</h1>
      <p>Come las bayas. No choques con el muro ni contigo.</p>
    </div>
    <button id="sound" type="button" aria-pressed="false">Sonido</button>
  </header>
  <section class="hud" aria-label="Marcador">
    <div class="stat"><span>Puntos</span><strong id="score">0</strong></div>
    <div class="stat gold"><span>Récord</span><strong id="best">0</strong></div>
    <div class="stat"><span>Ritmo</span><strong id="pace">1</strong></div>
  </section>
  <div class="stage" id="stage">
    <canvas id="board" width="600" height="600" aria-label="Tablero de la serpiente"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Listo</h2>
      <p id="overlayText">Flechas o WASD para moverte. Espacio pausa la partida.</p>
      <button id="start" type="button">Jugar</button>
    </div>
  </div>
  <div class="help">
    <span>Cada baya vale 10 puntos.</span>
    <span>La serpiente acelera al comer.</span>
  </div>
  <div class="pad" aria-label="Controles táctiles">
    <button id="up" type="button" aria-label="Arriba">↑</button>
    <button id="left" type="button" aria-label="Izquierda">←</button>
    <button id="down" type="button" aria-label="Abajo">↓</button>
    <button id="right" type="button" aria-label="Derecha">→</button>
  </div>
</main>
<script>
const COLS = 20;
const ROWS = 20;
const BEST_KEY = "serpiente-record";

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const stage = document.getElementById("stage");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const startBtn = document.getElementById("start");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const paceEl = document.getElementById("pace");
const soundBtn = document.getElementById("sound");

let snake, dir, queue, food, score, best, running, paused, over, won, countdown, acc, last;
let soundOn = false;
let audioCtx = null;

try { best = Number(localStorage.getItem(BEST_KEY) || 0); } catch (err) { best = 0; }
bestEl.textContent = String(best);

function reset() {
  snake = [{ x: 4, y: 10 }, { x: 3, y: 10 }, { x: 2, y: 10 }];
  dir = { x: 1, y: 0 };
  queue = [];
  score = 0;
  running = false;
  paused = false;
  over = false;
  won = false;
  countdown = 0;
  acc = 0;
  last = 0;
  food = placeFood();
  paintHud();
  showOverlay("Listo", "Al empezar hay 3 segundos para colocarte. Flechas o WASD. Espacio pausa.", "Jugar");
}

function placeFood() {
  const free = [];
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (!snake.some((part) => part.x === x && part.y === y)) free.push({ x, y });
    }
  }
  if (!free.length) return null;
  return free[Math.floor(Math.random() * free.length)];
}

function tickMs() {
  return Math.max(60, 200 - (score / 10) * 8);
}

function paceLevel() {
  return 1 + Math.floor(score / 50);
}

function paintHud() {
  scoreEl.textContent = String(score);
  paceEl.textContent = String(paceLevel());
}

function showOverlay(title, text, button) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  startBtn.textContent = button;
  overlay.classList.remove("hidden");
}

function hideOverlay() {
  overlay.classList.add("hidden");
}

function setDir(x, y) {
  if (!x && !y) return;
  const lastDir = queue.length ? queue[queue.length - 1] : dir;
  if (x === lastDir.x && y === lastDir.y) return;
  if (x === -lastDir.x && y === -lastDir.y) return;
  if (queue.length >= 2) queue.shift();
  queue.push({ x, y });
}

function begin() {
  if (over || won) reset();
  running = true;
  paused = false;
  countdown = 3;
  hideOverlay();
  last = 0;
  acc = 0;
  if (soundOn) tone(520, 0.06);
}

function togglePause() {
  if (!running || over || won) return;
  paused = !paused;
  if (paused) showOverlay("Pausa", "La partida sigue donde la dejaste.", "Continuar");
  else hideOverlay();
}

function step() {
  if (queue.length) dir = queue.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return end(false);
  const eating = food && head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  if (body.some((part) => part.x === head.x && part.y === head.y)) return end(false);
  snake.unshift(head);
  if (eating) {
    score += 10;
    paintHud();
    tone(740, 0.07);
    food = placeFood();
    if (!food) return end(true);
  } else {
    snake.pop();
  }
}

function end(victory) {
  running = false;
  over = !victory;
  won = victory;
  if (score > best) {
    best = score;
    try { localStorage.setItem(BEST_KEY, String(best)); } catch (err) { /* el récord vive solo en esta partida */ }
    bestEl.textContent = String(best);
  }
  tone(victory ? 880 : 140, victory ? 0.12 : 0.22, victory ? "triangle" : "sawtooth");
  if (victory) showOverlay("Tablero lleno", `Completaste el tablero con ${score} puntos.`, "Otra vez");
  else showOverlay("Fin de la partida", `Llegaste a ${score} puntos.`, "Reintentar");
}

function frame(time) {
  requestAnimationFrame(frame);
  if (running && !paused) {
    if (!last) last = time;
    acc += time - last;
    if (countdown > 0) {
      while (acc >= 1000 && countdown > 0) {
        countdown -= 1;
        acc -= 1000;
        if (countdown === 0) acc = 0;
      }
    } else {
      const stepMs = tickMs();
      while (acc >= stepMs && running && !paused) {
        step();
        acc -= stepMs;
      }
    }
  }
  last = time;
  draw();
}

function draw() {
  const width = canvas.width;
  const height = canvas.height;
  const cell = width / COLS;
  ctx.clearRect(0, 0, width, height);
  ctx.fillStyle = "#1c2820";
  ctx.fillRect(0, 0, width, height);
  ctx.strokeStyle = "rgba(243, 234, 215, 0.06)";
  ctx.lineWidth = 1;
  for (let i = 1; i < COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * cell, 0);
    ctx.lineTo(i * cell, height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * cell);
    ctx.lineTo(width, i * cell);
    ctx.stroke();
  }
  if (food) drawBerry(food.x, food.y, cell);
  snake.forEach((part, index) => drawSegment(part, index, cell));
  if (running && !paused && countdown > 0) {
    ctx.fillStyle = "rgba(20, 17, 14, 0.35)";
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = "#f3ead7";
    ctx.font = `700 ${Math.floor(cell * 4)}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(countdown), width / 2, height / 2);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawSegment(part, index, cell) {
  const pad = cell * (index === 0 ? 0.08 : 0.14);
  const x = part.x * cell + pad;
  const y = part.y * cell + pad;
  const size = cell - pad * 2;
  ctx.fillStyle = index === 0 ? "#e7ff8a" : index % 2 ? "#c6f54a" : "#9ed42a";
  roundRect(x, y, size, size, cell * 0.28);
  ctx.fill();
  if (index !== 0) return;
  const eye = cell * 0.08;
  const ox = dir.x * cell * 0.12;
  const oy = dir.y * cell * 0.12;
  const cx = x + size / 2 + ox;
  const cy = y + size / 2 + oy;
  const spread = cell * 0.16;
  ctx.fillStyle = "#14110e";
  const px = dir.y === 0 ? 0 : spread;
  const py = dir.x === 0 ? 0 : spread;
  ctx.beginPath();
  ctx.arc(cx - px, cy - py, eye, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + px, cy + py, eye, 0, Math.PI * 2);
  ctx.fill();
}

function drawBerry(x, y, cell) {
  const cx = x * cell + cell / 2;
  const cy = y * cell + cell / 2 + cell * 0.04;
  ctx.fillStyle = "#e85d4c";
  ctx.beginPath();
  ctx.arc(cx, cy, cell * 0.28, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f3ead7";
  ctx.beginPath();
  ctx.arc(cx - cell * 0.08, cy - cell * 0.08, cell * 0.07, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#7ea31d";
  ctx.lineWidth = Math.max(2, cell * 0.06);
  ctx.beginPath();
  ctx.moveTo(cx, cy - cell * 0.22);
  ctx.lineTo(cx + cell * 0.08, cy - cell * 0.38);
  ctx.stroke();
}

function tone(freq, duration, type = "square") {
  if (!soundOn) return;
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === "suspended") audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = 0.04;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.stop(audioCtx.currentTime + duration);
}

const keys = {
  ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
  ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
  ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
  ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
};

window.addEventListener("keydown", (event) => {
  const move = keys[event.key];
  if (move) {
    event.preventDefault();
    if (!running || over || won) begin();
    else if (paused) togglePause();
    setDir(move[0], move[1]);
    return;
  }
  if (event.key === " " || event.key === "Escape") {
    event.preventDefault();
    if (!running) begin();
    else togglePause();
  }
});

startBtn.addEventListener("click", () => {
  if (running && paused) togglePause();
  else begin();
});

soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  if (soundOn) tone(620, 0.05);
});

document.getElementById("up").addEventListener("click", () => steer(0, -1));
document.getElementById("left").addEventListener("click", () => steer(-1, 0));
document.getElementById("down").addEventListener("click", () => steer(0, 1));
document.getElementById("right").addEventListener("click", () => steer(1, 0));

function steer(x, y) {
  if (!running || over || won) begin();
  else if (paused) togglePause();
  setDir(x, y);
}

let swipeX = 0;
let swipeY = 0;
stage.addEventListener("pointerdown", (event) => {
  swipeX = event.clientX;
  swipeY = event.clientY;
});
stage.addEventListener("pointerup", (event) => {
  const dx = event.clientX - swipeX;
  const dy = event.clientY - swipeY;
  if (Math.hypot(dx, dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? 1 : -1, 0);
  else steer(0, dy > 0 ? 1 : -1);
});

function fitCanvas() {
  const size = Math.floor(stage.getBoundingClientRect().width);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  draw();
}

window.addEventListener("resize", fitCanvas);
reset();
fitCanvas();
requestAnimationFrame(frame);
</script>
</body>
</html>
